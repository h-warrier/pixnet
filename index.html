<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixNet</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <!-- Ambient background shapes for a desktop feel -->
    <div class="ambient-bg" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
        <span class="blob b4"></span>
    </div>

    <div class="app-grid">
        <aside class="sidebar">
            <div class="brand">
                <h2>PixNet</h2>
                <p class="tag">AI Chat · Desktop</p>
            </div>

            <div class="conversations">
                <div class="conv active" id="conv-general">General</div>
                <div class="conv" id="conv-project">Project Notes</div>
                <div class="conv" id="conv-feedback">Feedback</div>
            </div>

            <footer class="sidebar-footer">
                <small>Logged in as <strong>h-warrier</strong></small>
            </footer>
        </aside>

        <main class="main-chat">
            <header class="chat-header">
                <div class="header-left">
                    <h3>General</h3>
                    <span class="status">Online</span>
                </div>
                <div class="header-right">
                    <button class="icon-btn" id="btn-theme" title="Toggle theme"><i class="fas fa-moon"></i></button>
                </div>
            </header>

            <section class="chat-container">
                <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
                    <div class="message bot-message">Hello! I'm an AI assistant. How can I help you today?</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="user-input" placeholder="Type your message... (Enter to send, Ctrl+Enter for newline)" autofocus>
                    <button id="send-button" disabled title="Send message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- Feedback modal (opens mail client) -->
    <div id="feedback-modal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="feedback-title">
      <div class="modal-panel" role="document">
        <header class="modal-header">
          <h2 id="feedback-title">Send Feedback</h2>
          <button class="modal-close" id="feedback-close" aria-label="Close">&times;</button>
        </header>
        <div class="modal-body">
          <label for="fb-subject">Subject</label>
          <input id="fb-subject" type="text" placeholder="Feedback subject">
          <label for="fb-body">Message</label>
          <textarea id="fb-body" rows="6" placeholder="Describe your feedback..."></textarea>
        </div>
        <footer class="modal-footer">
          <button id="fb-send" class="btn-primary">Open Mail App</button>
          <button id="fb-copy" class="btn-ghost">Copy Email Address</button>
        </footer>
      </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
