<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixNet</title>
    <meta name="description" content="PixNet AI assistant interface">
    <link rel="stylesheet" href="style.css?v=20261017-tablet-safe">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="ambient-bg" aria-hidden="true">
        <span class="blob b1"></span>
        <span class="blob b2"></span>
        <span class="blob b3"></span>
        <span class="blob b4"></span>
    </div>

    <div class="app-grid">
        <aside class="sidebar">
            <div class="brand">
                <h2>PixNet</h2>
                <p class="tag">AI assistant</p>
            </div>

            <div class="conversations">
                <div class="conv active">General</div>
                <div class="conv">Project Notes</div>
                <div class="conv">Feedback</div>
            </div>

            <footer class="sidebar-footer">
                <small>Logged in as <strong>h-warrier</strong></small>
            </footer>
        </aside>

        <main class="main-chat">
            <header class="chat-header">
                <div class="header-left">
                    <h3>General</h3>
                    <span class="status">Online</span>
                </div>
                <button class="icon-btn" id="btn-theme" type="button" aria-label="Toggle theme">
                    <i class="fas fa-moon"></i>
                </button>
            </header>

            <section class="chat-container" aria-label="Chat application">
                <div class="chat-messages" id="chat-messages" role="log" aria-live="polite">
                    <div class="message bot-message">Hello! I'm an AI assistant. How can I help you today?</div>
                </div>

                <div class="chat-input-area">
                    <input type="text" id="user-input" placeholder="Type your message..." autofocus>
                    <button id="send-button" type="button" disabled aria-label="Send message">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js?v=20261017-tablet-safe"></script>
</body>
</html>
